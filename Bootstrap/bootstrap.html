<!DOCTYPE html>
<html>

<head>

    <title>My Hobby Cards</title>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- STEP 1 - Bootstrap CSS link -->

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        .hobby-card {
            background-color: aquamarine;
            padding: 20px;
            border-color: black;
            border-radius: 20px;
            border: solid;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            margin: 10px;
        }

        h1 {
            font-family: fantasy;
            padding: 20px;
            color: crimson;
        }

        h3 {
            color: crimson;
            font-family: cursive;
        }
    </style>
</head>

<body>
    <h1>My Hobby Cards</h1>
    <div class="container">
        <div class="row">

            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Drawing</h3>
                    <p>I love drawing birds.</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Movies</h3>
                    <p>I like watching movies.</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Games</h3>
                    <p>I love games.</p>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
